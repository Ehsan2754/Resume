name: Deployment

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  
concurrency:
  group: "pages"
  cancel-in-progress: true
env:
  SRC_DIR: ./
  SRC_FILE: resume.tex
  
jobs:

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pandoc and build HTML
        # cosmetic only (pandoc cannot interpret the moderncv/persona macros); never block the Pages deploy on it
        continue-on-error: true
        run: |
          mkdir -p pages
          sudo apt install -y pandoc 
          sudo cp -r ./Images ./pages 
          sudo pandoc resume.tex --toc -s -o ./pages/index.html
          
      - name: Setup Pages 
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './pages'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
        




