name: Resume build

# One source, one PDF per persona (see README.md). ONE build job (make all), then ONE release with all PDFs attached.
# TeX Live is a minimal scheme-basic install that setup-texlive-action caches between runs (no apt TeX install).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "archive/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build all personas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live (minimal, cached)
        uses: teatimeguest/setup-texlive-action@v3
        timeout-minutes: 6
        with:
          scheme: basic
          # XeLaTeX + moderncv (classic) + fontawesome5/academicons icon fonts + ngerman + the packages in Setting/packages.tex.
          # Dependencies (hyperref helpers, l3*, etc.) are resolved by tlmgr.
          packages: |
            latexmk
            xetex
            fontspec
            lm
            lmodern
            moderncv
            fontawesome5
            academicons
            babel
            babel-german
            hyphen-german
            datetime
            fmtcount
            etoolbox
            hyperref
            url
            microtype
            xcolor
            colortbl
            geometry
            adjustbox
            collectbox
            trimclip
            ifoddpage
            varwidth
            ragged2e
            anyfontsize
            graphics
            graphics-def
            graphics-cfg
            tools
            amsmath
            xkeyval
            iftex
            l3kernel
            l3packages
            l3backend
            changepage
            fancyhdr
            arydshln
            multirow

      - name: Install poppler-utils (pdftotext, pdfinfo)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: poppler-utils
          version: 1.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/build.yaml

      - name: Install PyMuPDF (hidden-text check)
        run: pip install pymupdf

      - name: Build and check (make all)
        timeout-minutes: 5
        run: |
          set -o pipefail
          make all 2>&1 | tee build.log
          # Mark only the PDFs whose own check printed "WARN: unreconciled" (check output follows its "built <pdf>" line).
          awk '/^built /{f=$2} /^WARN: unreconciled/{if(f!="") print f}' build.log | while read -r f; do
            echo "unreconciled placeholders" > "$f.warn"
          done
          ls -l dist

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: resumes
          path: |
            dist/*.pdf
            dist/*.warn
          if-no-files-found: error
          retention-days: 30

      - name: Upload LaTeX logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs
          path: build/*/resume.log
          if-no-files-found: ignore

  release:
    name: publish release
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: resumes
          path: dist

      - name: Compose release metadata
        id: meta
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="build-${DATE}-${GITHUB_RUN_NUMBER}"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=Resumes ${DATE} (#${GITHUB_RUN_NUMBER})" >> "$GITHUB_OUTPUT"
          row() { # id headline-short file photo
            local f="dist/$3"; local mark=""
            [ -f "$f.warn" ] && mark=" ⚠️"
            echo "| \`$1\` | $2 | \`$3\`$mark | $4 |"
          }
          {
            echo "Built from \`${GITHUB_SHA::7}\` by run #${GITHUB_RUN_NUMBER}. One PDF per persona:"
            echo
            echo "| Persona | Focus | File | Photo |"
            echo "|---|---|---|---|"
            row A-edgeml      "Embedded Linux & on-device ML"  Shaghaei_Ehsan_Resume_EdgeML.pdf        no
            row B-platformfw  "Firmware & embedded Linux platform (default)" Shaghaei_Ehsan_Resume_PlatformFW.pdf yes
            row C-englead     "Engineering lead"               Shaghaei_Ehsan_Resume_EngLead.pdf       no
            row D-fae         "Applications / field engineering" Shaghaei_Ehsan_Resume_FAE.pdf         yes
            row E-lowlatency  "Low-latency C++ systems"        Shaghaei_Ehsan_Resume_LowLatencyCpp.pdf no
            echo
            echo "⚠️ = this PDF still contains unreconciled numbers or ⚠️ placeholders (see \`make check\` output in the run log). Not for sending until reconciled."
            echo
            echo "All PDFs passed the text-layer, banned-word and hidden-text gates."
          } > release-body.md
          rm -f dist/*.warn
          ls -l dist; cat release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body_path: release-body.md
          target_commitish: ${{ github.sha }}
          files: dist/*.pdf
          fail_on_unmatched_files: true
