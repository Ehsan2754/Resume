name: Resume build

# One source, one PDF per persona (see README.md). Matrix build, then ONE release with all PDFs attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.persona }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        persona: [A-edgeml, B-platformfw, C-englead, D-fae, E-lowlatency]
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live (XeLaTeX, moderncv, fontawesome5, academicons, ngerman) and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-fonts-extra texlive-fonts-recommended \
            texlive-lang-german latexmk poppler-utils make

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyMuPDF (hidden-text check)
        run: pip install pymupdf

      - name: Build and check (make ${{ matrix.persona }})
        run: |
          set -o pipefail
          make ${{ matrix.persona }} 2>&1 | tee build.log
          # Mark PDFs that still contain unreconciled values / placeholders (check only warns for these).
          if grep -q '^WARN: unreconciled' build.log; then
            for f in dist/*.pdf; do echo "unreconciled placeholders" > "$f.warn"; done
          fi

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: resume-${{ matrix.persona }}
          path: |
            dist/*.pdf
            dist/*.warn
          if-no-files-found: error
          retention-days: 30

      - name: Upload LaTeX log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.persona }}
          path: build/${{ matrix.persona }}/resume.log
          if-no-files-found: ignore

  release:
    name: publish release
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: resume-*
          path: dist
          merge-multiple: true

      - name: Compose release metadata
        id: meta
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="build-${DATE}-${GITHUB_RUN_NUMBER}"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=Resumes ${DATE} (#${GITHUB_RUN_NUMBER})" >> "$GITHUB_OUTPUT"
          row() { # id headline-short file photo
            local f="dist/$3"; local mark=""
            [ -f "$f.warn" ] && mark=" ⚠️"
            echo "| \`$1\` | $2 | \`$3\`$mark | $4 |"
          }
          {
            echo "Built from \`${GITHUB_SHA::7}\` by run #${GITHUB_RUN_NUMBER}. One PDF per persona:"
            echo
            echo "| Persona | Focus | File | Photo |"
            echo "|---|---|---|---|"
            row A-edgeml      "Embedded Linux & on-device ML"  Shaghaei_Ehsan_Resume_EdgeML.pdf        no
            row B-platformfw  "Firmware & embedded Linux platform (default)" Shaghaei_Ehsan_Resume_PlatformFW.pdf yes
            row C-englead     "Engineering lead"               Shaghaei_Ehsan_Resume_EngLead.pdf       no
            row D-fae         "Applications / field engineering" Shaghaei_Ehsan_Resume_FAE.pdf         yes
            row E-lowlatency  "Low-latency C++ systems"        Shaghaei_Ehsan_Resume_LowLatencyCpp.pdf no
            echo
            echo "⚠️ = this PDF still contains unreconciled numbers or ⚠️ placeholders (see \`make check\` output in the run log). Not for sending until reconciled."
            echo
            echo "All PDFs passed the text-layer, banned-word and hidden-text gates."
          } > release-body.md
          rm -f dist/*.warn
          ls -l dist; cat release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body_path: release-body.md
          target_commitish: ${{ github.sha }}
          files: dist/*.pdf
          fail_on_unmatched_files: true
