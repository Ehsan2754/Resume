name: Resume build

# One source, one PDF per persona (see README.md). ONE build job (make all), then ONE release with all PDFs attached.
# TeX Live is a minimal scheme-basic install cached with actions/cache (no apt TeX install).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "archive/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build all personas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # XeLaTeX + moderncv (classic) + fontawesome5/academicons icon fonts + ngerman + packages from Setting/packages.tex.
      # tlmgr resolves dependencies (hyperref helpers, l3*, ...). Changing this list changes the cache key.
      TL_PACKAGES: >-
        latexmk xetex fontspec lm lmodern moderncv fontawesome5 academicons
        babel babel-german hyphen-german datetime fmtcount etoolbox hyperref url microtype
        xcolor colortbl geometry adjustbox collectbox trimclip ifoddpage varwidth ragged2e
        anyfontsize graphics graphics-def graphics-cfg tools amsmath xkeyval iftex
        l3kernel l3packages l3backend changepage fancyhdr arydshln multirow
    steps:
      - uses: actions/checkout@v4

      # Third-party setup-texlive-action is blocked for this repo ("Repository access blocked"), so: official install-tl
      # (scheme-basic, no docs/sources) + explicit package list, cached with actions/cache. Cold = install, warm = restore.
      - name: TeX package-set key
        id: tlkey
        run: echo "hash=$(printf '%s' "$TL_PACKAGES" | sha1sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore TeX Live cache
        id: tlcache
        uses: actions/cache@v4
        with:
          path: ~/texlive
          key: texlive-${{ runner.os }}-2026-${{ steps.tlkey.outputs.hash }}

      - name: Install TeX Live (scheme-basic + explicit packages)
        if: steps.tlcache.outputs.cache-hit != 'true'
        timeout-minutes: 6
        run: |
          set -euo pipefail
          # Surface the tail of the install log as an annotation if anything fails (job logs are not always retrievable).
          exec > >(tee "$RUNNER_TEMP/tl-install.log") 2>&1
          trap 'rc=$?; sleep 1; echo "::error title=TeX install failed rc=$rc::$(grep -iE "not present|error|unknown|fail|cannot|warning" "$RUNNER_TEMP/tl-install.log" | head -n 20 | tr -d "%\r" | paste -sd "|" -)"' ERR
          # Pin one working CTAN mirror (the mirror.ctan.org redirector sometimes lands on mirrors with bad certificates).
          REPO=""
          for m in https://ctan.math.illinois.edu/systems/texlive/tlnet https://mirrors.mit.edu/CTAN/systems/texlive/tlnet \
                   https://ftp.fau.de/ctan/systems/texlive/tlnet https://mirror.ctan.org/systems/texlive/tlnet; do
            if curl -fsSI --max-time 20 "$m/install-tl-unx.tar.gz" >/dev/null; then REPO="$m"; break; fi
          done
          test -n "$REPO"
          echo "mirror: $REPO"
          mkdir -p "$RUNNER_TEMP/tlinst" && cd "$RUNNER_TEMP/tlinst"
          curl -fsSL "${REPO}/install-tl-unx.tar.gz" | tar xz --strip-components=1
          cat > texlive.profile <<EOF
          selected_scheme scheme-basic
          TEXDIR $HOME/texlive/current
          TEXMFLOCAL $HOME/texlive/texmf-local
          TEXMFSYSCONFIG $HOME/texlive/current/texmf-config
          TEXMFSYSVAR $HOME/texlive/current/texmf-var
          TEXMFCONFIG $HOME/.texlive/texmf-config
          TEXMFVAR $HOME/.texlive/texmf-var
          instopt_adjustpath 0
          instopt_adjustrepo 0
          tlpdbopt_autobackup 0
          tlpdbopt_install_docfiles 0
          tlpdbopt_install_srcfiles 0
          tlpdbopt_create_formats 1
          EOF
          perl install-tl --profile=texlive.profile --repository "$REPO" --no-interaction
          TLBIN="$(echo "$HOME"/texlive/current/bin/*)"
          "$TLBIN/tlmgr" option repository "$REPO"
          # shellcheck disable=SC2086
          "$TLBIN/tlmgr" install $TL_PACKAGES

      - name: Put TeX Live on PATH
        run: |
          TLBIN="$(echo "$HOME"/texlive/current/bin/*)"
          echo "$TLBIN" >> "$GITHUB_PATH"
          "$TLBIN/xelatex" --version | head -1

      - name: Install poppler-utils (pdftotext, pdfinfo)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: poppler-utils
          version: 1.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/build.yaml

      - name: Install PyMuPDF (hidden-text check)
        run: pip install pymupdf

      - name: Build and check (make all)
        timeout-minutes: 5
        run: |
          set -o pipefail
          make all 2>&1 | tee build.log
          # Mark only the PDFs whose own check printed "WARN: unreconciled" (check output follows its "built <pdf>" line).
          awk '/^built /{f=$2} /^WARN: unreconciled/{if(f!="") print f}' build.log | while read -r f; do
            echo "unreconciled placeholders" > "$f.warn"
          done
          ls -l dist

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: resumes
          path: |
            dist/*.pdf
            dist/*.warn
          if-no-files-found: error
          retention-days: 30

      - name: Upload LaTeX logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs
          path: build/*/resume.log
          if-no-files-found: ignore

  release:
    name: publish release
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: resumes
          path: dist

      - name: Compose release metadata
        id: meta
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="build-${DATE}-${GITHUB_RUN_NUMBER}"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=Resumes ${DATE} (#${GITHUB_RUN_NUMBER})" >> "$GITHUB_OUTPUT"
          row() { # id headline-short file photo
            local f="dist/$3"; local mark=""
            [ -f "$f.warn" ] && mark=" ⚠️"
            echo "| \`$1\` | $2 | \`$3\`$mark | $4 |"
          }
          {
            echo "Built from \`${GITHUB_SHA::7}\` by run #${GITHUB_RUN_NUMBER}. One PDF per persona:"
            echo
            echo "| Persona | Focus | File | Photo |"
            echo "|---|---|---|---|"
            row A-edgeml      "Embedded Linux & on-device ML"  Shaghaei_Ehsan_Resume_EdgeML.pdf        no
            row B-platformfw  "Firmware & embedded Linux platform (default)" Shaghaei_Ehsan_Resume_PlatformFW.pdf yes
            row C-englead     "Engineering lead"               Shaghaei_Ehsan_Resume_EngLead.pdf       no
            row D-fae         "Applications / field engineering" Shaghaei_Ehsan_Resume_FAE.pdf         yes
            row E-lowlatency  "Low-latency C++ systems"        Shaghaei_Ehsan_Resume_LowLatencyCpp.pdf no
            echo
            echo "⚠️ = this PDF still contains unreconciled numbers or ⚠️ placeholders (see \`make check\` output in the run log). Not for sending until reconciled."
            echo
            echo "All PDFs passed the text-layer, banned-word and hidden-text gates."
          } > release-body.md
          rm -f dist/*.warn
          ls -l dist; cat release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body_path: release-body.md
          target_commitish: ${{ github.sha }}
          files: dist/*.pdf
          fail_on_unmatched_files: true
